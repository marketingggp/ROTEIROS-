<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>âme wellness · grupo vip</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');

  :root {
    --marinho: #1a2e4a;
    --off-white: #f5f2ee;
    --dourado: #b8956a;
    --dourado-light: #d4b48a;
    --marrom: #5a3e2b;
    --marrom-claro: #7a5a40;
    --areia: #c9b49a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--off-white);
    font-family: 'Crimson Pro', Georgia, serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .page {
    max-width: 400px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-bar {
    width: 100%;
    height: 3px;
    background: linear-gradient(to right, transparent, var(--dourado), transparent);
    margin-bottom: 40px;
  }

  .logo-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 36px;
  }

  .logo-image {
    width: 300px;
    height: auto;
  }

  .divider-marinho {
    width: 1px;
    height: 36px;
    background: linear-gradient(to bottom, transparent, var(--marinho), transparent);
    margin: 0 auto 36px;
    opacity: 0.3;
  }

  .headline {
    text-align: center;
    margin-bottom: 28px;
  }

  .headline-eyebrow {
    color: var(--marrom);
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: block;
  }

  .headline-main {
    color: var(--marinho);
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-weight: 300;
    font-style: italic;
    line-height: 1.35;
    margin-bottom: 14px;
  }

  .headline-sub {
    color: var(--marrom-claro);
    font-size: 16px;
    font-weight: 300;
    line-height: 1.65;
  }

  .launch-badge {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 28px 0;
    width: 100%;
  }

  .launch-badge::before,
  .launch-badge::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--dourado));
  }

  .launch-badge::after {
    background: linear-gradient(to left, transparent, var(--dourado));
  }

  .launch-date {
    color: var(--marinho);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    white-space: nowrap;
    padding: 6px 14px;
    border: 1px solid var(--dourado);
    background: transparent;
  }

  .cta-container {
    width: 100%;
    margin-bottom: 28px;
  }

  .cta-button {
    display: block;
    width: 100%;
    padding: 18px 32px;
    background: var(--marinho);
    border: none;
    color: var(--off-white);
    font-family: 'Crimson Pro', serif;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-decoration: none;
    text-align: center;
    cursor: pointer;
    transition: all 0.35s ease;
    position: relative;
    overflow: hidden;
  }

  .cta-button::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background: var(--dourado);
  }

  .cta-button:hover {
    background: var(--marrom);
  }

  .cta-label {
    display: block;
    color: var(--marrom);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    margin-top: 10px;
    opacity: 0.55;
  }

  .gold-accent {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 16px 0 28px;
  }

  .gold-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--dourado);
  }

  .gold-line {
    flex: 1;
    height: 1px;
    background: var(--dourado);
    opacity: 0.4;
  }

  .footer {
    margin-top: 32px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .footer-text {
    color: var(--marrom);
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 2px;
    opacity: 0.6;
  }

  .bottom-bar {
    width: 100%;
    height: 3px;
    background: linear-gradient(to right, transparent, var(--dourado), transparent);
    margin-top: 36px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .top-bar      { animation: fadeUp 0.6s ease both; }
  .logo-container { animation: fadeUp 0.6s 0.1s ease both; }
  .divider-marinho { animation: fadeUp 0.6s 0.2s ease both; }
  .headline     { animation: fadeUp 0.6s 0.3s ease both; }
  .launch-badge { animation: fadeUp 0.6s 0.4s ease both; }
  .cta-container { animation: fadeUp 0.6s 0.5s ease both; }
  .gold-accent  { animation: fadeUp 0.6s 0.55s ease both; }
  .footer       { animation: fadeUp 0.6s 0.6s ease both; }
  .bottom-bar   { animation: fadeUp 0.6s 0.65s ease both; }
</style>
</head>
